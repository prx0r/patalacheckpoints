## How to use this

1. **Content** stays in the markdown files (canonical). This manifest only defines
   structure + order.
2. When the docs framework is chosen, a script reads this manifest → generates the
   site's `sidebar`/`nav` config → points each page at its source file.
3. New pages: add a row here + the source markdown, in the right section.
