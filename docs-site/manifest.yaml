# Pāṭala Docs — Navigation Manifest

*This manifest is the canonical structure for **docs.patala.org**. It defines the
sections, the order, and which source file each page renders from. A docs-site
generator (Docusaurus / VitePress / MkDocs, decided later) consumes this to build
the site. Content lives in the markdown files; this file is the skeleton.*

## Overview

```
docs.patala.org
├── /                    home (from README.md)
├── /guides              the "5-minute start" + research recipes
├── /concepts            the epistemic model + data model
├── /pipeline            the translation pipeline + stacked artifact
├── /api                 the API reference + recipes
├── /reference           the strategy + endgame specs
└── /status              checkpoints, changelog, progress
```

