# CONTEXT-CHAIN.yaml — the FULL ordered context chain every agent must read before any build.
#
# WHY THIS EXISTS: the orientation used to be a passive reading list. Nothing forced an agent to read
# ALL of it, so agents stopped early and never built full-context understanding. This file is the
# SOURCE OF TRUTH for "what is full context," and `handover/context_gate.py` mechanically enforces it.
#
# THE ORDER (context engineering — this ordering IS the design):
#   A. WHO YOU ARE + HOW YOU OPERATE   (identity, the operating rule, the agent system, the doctrine)
#   B. THE PROJECT — VISION            (highest level first: north star → core bible → vision index →
#                                       derivation graph → mapped to real infra)
#   C. THE MAP                         (where everything lives: doc index + handover + docs homes)
#   D. THE EXECUTION MAP + CONTRACTS   (checkpoints + the 9-field anti-theatre contracts)
#   E. THE SCHOLARLY SYSTEM            (how the corpus + objects are actually built)
#   → per-agent lane, granular, ENDING at that lane's MOST RECENT HANDOVER.
#
# RULES:
#   - `shared` is read FIRST by every agent, in order (the whole-system context).
#   - each agent's `agents.<id>` chain is read AFTER `shared`, in order, and ends at its latest handover.
#   - confirmation is ORDERED: you can only confirm entry N after entries 1..N-1 are confirmed.
#   - paths are repo-root-relative and must exist — `context_gate.py --validate` fails on a missing file.
#   - keep IDs stable once a doc is in the chain (read-records are keyed by id); add new docs with a
#     new id rather than renaming an existing one.

