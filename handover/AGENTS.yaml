# AGENTS.yaml — the agent registry: ONE template (agent0), N live instances
#
# ARCHITECTURE (the model):
#   agent0 is the AGNOSTIC TEMPLATE / archetype — the abstract structure every agent is an
#   instantiation of. It defines:
#     - the schema every agent must fill (id, name, direction, lane, question, checkpoints,
#       owns, orientation, handover_dir, must_not_touch)
#     - the shared doctrine + tone axioms (adopted by every instance)
#     - the lifecycle (the process-workflow orientation template + the live flow)
#   agent1, agent2, ... are LIVE INSTANCES of that template — each is "agent0" applied to a specific
#   lane, with concrete file references and a tracked history (handover/<id>/history.log + STATE.yaml).
#
# This is the agnostic design: add a new agent = instantiate the template (a new `instances` entry +
# a handover dir + an orientation generated from the template). Nothing else changes.
#
# The registry is the CONTRACT. The staleness checker (handover/check_staleness.py) validates that
# each instance's actual files match its entry. flow.py manages the live state (STATE.yaml).

version: "2.0"
updated: "2026-08-12"

# ── THE TEMPLATE (agent0 — the archetype every agent instantiates) ─────────────
# agent0 is NOT a live lane. It is the abstract shape. Its "checkpoints" = the lifecycle phases a
# live instance goes through. Its "orientation" = the TEMPLATE, not a lane-specific doc.
template:
  id: agent0
  name: "The Agent Archetype (agnostic template)"
  role: "agent0 is not a lane. It is the abstract structure that agent1, agent2, ... become live instances of."
  schema:
    - id
    - name
    - direction
    - lane
    - question
    - checkpoints
    - owns
    - orientation
    - handover_dir
    - must_not_touch
  lifecycle_phases:   # every live instance passes through these (the orientation template's phases)
    - "PHASE 0 — identity + vision + the two-lane awareness"
    - "PHASE 1 — the doctrine + tone axioms"
    - "PHASE 2 — the agent-specific handover + session"
    - "PHASE 3 — explore the actual codebase"
    - "PHASE 4 — the exact next steps"
    - "PHASE 5 — guardrails + falsification self-check"
    - "PHASE 6 — carry-forward"
  orientation_template: "handover/ORIENTATION-TEMPLATE.md"
  live_flow:
    status: "python3 handover/flow.py status"
    update: "python3 handover/flow.py update <id> <cp> <status> -n '<note>' --by <id>"
    history: "python3 handover/flow.py history"
    add_instance: "python3 handover/flow.py add-agent <id>"
  owns:
    - "handover/SYSTEM.md"
    - "handover/AGENTS.yaml"
    - "handover/STATE.yaml"
    - "handover/flow.py"
    - "handover/check_staleness.py"
  status: "TEMPLATE"
  updated: "2026-08-12"

# ── SHARED DOCTRINE (adopted by EVERY live instance) ──────────────────────────
doctrine:
  one_rule: "Nothing is 'real' because code exists. It becomes real only when independent gold + blind eval + metric + human adjudication show it does what its name claims."
  tone_axioms:
    - "BE BRUTALLY HONEST about what is real vs hollow. Interrogate 'is this useful?' — do not assume yes."
    - "RETRACT OVERCLAIMS explicitly. 'I was a yes-man. The honest version is X.' Never compound a lie."
    - "NAME THE FAILURE MODE when you see it — the same circularity as B-STRUCT, a hardcoded status, a fuzzy ID."
    - "SEPARATE REAL FROM THEATER plainly. Category A (infrastructure) is not a result. Evidence + measurement is a result."
    - "NO HYPE. 'structurally sound' is not 'scholarship'. 'tests pass' is not 'this works'. A checker passing on your own docs is circular, not a win."
    - "PRECISION OVER COVERAGE. Abstain rather than invent. 'NO UNIQUE ARGUMENT RECOVERABLE' is a valid, valuable output."

# ── THE LIVE INSTANCES (agent1, agent2, ... are 'agent0' applied to a lane) ─────
instances:
  agent1:
    id: agent1
    instance_of: agent0        # this is an instantiation of the archetype
    name: "Agent 1 — ML / research"
    direction: "horizontal + upward derivation"
    lane: "C1 → themes → arguments → claims → synthesis → review"
    question: "Does this higher-order representation legitimately derive from the scholarly objects beneath it?"
    checkpoints: [ CP0, CP2, CP3, CP4 ]
    owns:
      - "benchmarks/v0/"
      - "machinelearning/research/patala_ml/"
      - "handover/agent-1-ml/"
    orientation: "handover/agent-1-ml/ORIENTATION.md"
    handover_dir: "handover/agent-1-ml/"
    history: "handover/agent-1-ml/history.log"   # tracked, per-instance
    must_not_touch:
      - "data/corpus/"
      - "app/"
      - "lib/"
      - "pipeline/verify_l0.py"
      - "philproof.py"
    status: "ACTIVE"
    updated: "2026-08-12"

  agent2:
    id: agent2
    instance_of: agent0
    name: "Agent 2 — L0 / integration"
    direction: "vertical truth"
    lane: "SOURCE → segmentation → morphology → syntax → alignment → translation proof"
    question: "Is this reading licensed by the source?"
    checkpoints: [ CP1 ]
    owns:
      - "data/corpus/"
      - "app/"
      - "lib/"
      - "pipeline/verify_l0.py"
      - "philproof.py"
      - "handover/agent-2-integration/"
    orientation: "handover/agent-2-integration/ORIENTATION.md"
    handover_dir: "handover/agent-2-integration/"
    history: "handover/agent-2-integration/history.log"
    must_not_touch:
      - "benchmarks/v0/"
      - "machinelearning/research/patala_ml/"
    status: "ACTIVE"
    updated: "2026-08-12"
